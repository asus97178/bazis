# Runs scripts/ci.ts on a GitHub-hosted ubuntu-latest (glibc x64) with the
# official Bun release; scripts/osnova-bun refuses it unless its hash matches
# toolchain/bun.json. A cloud runner is also what npm --provenance requires.
name: CI

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: "Also run the live PostgreSQL qualification (Docker)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Qualified Bun (hash-pinned in toolchain/bun.json)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bun.zip" https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          echo "OSNV_BUN_BIN=$RUNNER_TEMP/bun-linux-x64/bun" >> "$GITHUB_ENV"

      - name: Toolchain check
        run: ./scripts/osnova-bun --no-env-file run toolchain:check

      - name: Install dependencies
        run: ./scripts/osnova-bun --no-env-file install --frozen-lockfile

      - name: Pipeline
        if: ${{ !inputs.live }}
        run: ./scripts/osnova-bun --no-env-file run ci

      - name: Pipeline with live PostgreSQL
        if: ${{ inputs.live }}
        run: ./scripts/osnova-bun --no-env-file run ci -- --live "$RUNNER_TEMP/live-postgres-${{ github.run_id }}"

      - name: Keep live evidence
        if: ${{ inputs.live && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: live-postgres-${{ github.run_id }}
          path: ${{ runner.temp }}/live-postgres-${{ github.run_id }}
          if-no-files-found: ignore
