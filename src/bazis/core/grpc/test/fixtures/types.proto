syntax = "proto3";
package fixtures;
import "echo.proto";

enum State { UNKNOWN = 0; ACTIVE = 1; }
message Scalars {
  double d = 1; float f = 2;
  int32 i32 = 3; int64 i64 = 4; uint32 u32 = 5; uint64 u64 = 6;
  sint32 s32 = 7; sint64 s64 = 8;
  fixed32 fx32 = 9; fixed64 fx64 = 10; sfixed32 sfx32 = 11; sfixed64 sfx64 = 12;
  bool enabled = 13; string display_name = 14; bytes payload = 15;
  State state = 16;
  repeated sint32 numbers = 17;
  repeated uint32 unpacked = 18 [packed = false];
  map<string, bazis.test.Message> by_key = 19;
  oneof selection { string label = 20; bazis.test.Message nested = 21; }
  optional int32 explicit_zero = 22;
  message Inner { string text = 1; }
  Inner inner = 23;
  Scalars child = 24;
}
service Types {
  rpc RoundTrip(Scalars) returns (Scalars);
}
